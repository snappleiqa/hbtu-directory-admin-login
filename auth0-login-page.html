<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Data Login</title>

<!-- Auth0 SPA SDK via CDN — no build step needed -->
<script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>

<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #2b2b2b;
    --border: #e2e2e2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    text-align: center;
    transition: max-width 0.2s ease;
  }
  .card:has(#private-content[style*="block"]) {
    max-width: 900px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p.sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  button {
    width: 100%;
    padding: 12px 16px;
    font-size: 15px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: var(--accent);
    color: white;
    margin-top: 8px;
  }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--border);
  }
  button:hover { opacity: 0.9; }
  #status { font-size: 13px; color: var(--muted); margin-top: 16px; }
  #private-content {
    display: none;
    text-align: left;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="card">
  <h1>Private Data Access</h1>
  <p class="sub">Sign in to view this content.</p>

  <button id="login-btn" class="hidden">Log In</button>
  <button id="logout-btn" class="secondary hidden">Log Out</button>

  <div id="status">Checking session…</div>

  <div id="private-content">
    <!-- Replace YOUR_SHEET_ID_HERE with your actual Google Sheet's ID
         (found in the Sheet's URL between /d/ and /edit).
         The Sheet must be set to "Publish to web" for this to load. -->
    <iframe
      src="https://docs.google.com/spreadsheets/d/YOUR_SHEET_ID_HERE/pubhtml?widget=true&headers=false"
      style="width: 100%; height: 500px; border: 1px solid var(--border); border-radius: 8px;"
      title="Private data">
    </iframe>
  </div>
</div>

<script>
  // ----------------------------------------------------------------
  // CONFIG — replace these three values with your own Auth0 app details
  // Find them in Auth0 Dashboard → Applications → your app → Settings
  // ----------------------------------------------------------------
  const AUTH0_DOMAIN = "dev-c4csvsy0qdcgpchx.us.auth0.com";
  const AUTH0_CLIENT_ID = "hIqYmrFslltXL9pirAHG4d3Q7Za52ajq";
  const REDIRECT_URI = window.location.origin + window.location.pathname;
  const GOOGLE_SITES_PRIVATE_PAGE = "https://sites.google.com/moh.gov.my/ukphbtu/direktori-pegawai-on-call";

  // Optional: restrict access to specific accounts by email.
  // Leave empty array to allow any authenticated Auth0 user.
  const ALLOWED_EMAILS = []; // e.g. ["admin@example.com"]

  let auth0Client = null;

  const loginBtn = document.getElementById("login-btn");
  const logoutBtn = document.getElementById("logout-btn");
  const statusEl = document.getElementById("status");
  const privateContent = document.getElementById("private-content");

  async function initAuth0() {
    auth0Client = await auth0.createAuth0Client({
      domain: AUTH0_DOMAIN,
      clientId: AUTH0_CLIENT_ID,
      authorizationParams: {
        redirect_uri: REDIRECT_URI
      },
      cacheLocation: "localstorage", // helps session survive iframe reloads
      useRefreshTokens: true
    });

    // Handle the redirect back from Auth0 after login
    const query = window.location.search;
    if (query.includes("code=") && query.includes("state=")) {
      await auth0Client.handleRedirectCallback();
      window.history.replaceState({}, document.title, REDIRECT_URI);
    }

    await updateUI();
  }

  async function updateUI() {
    const isAuthenticated = await auth0Client.isAuthenticated();

    if (isAuthenticated) {
      const userProfile = await auth0Client.getUser();

      const isAllowed =
        ALLOWED_EMAILS.length === 0 ||
        ALLOWED_EMAILS.includes(userProfile.email);

      if (isAllowed) {
        statusEl.textContent = "Signed in as " + userProfile.email;
        privateContent.style.display = "block";
        loginBtn.classList.add("hidden");
        logoutBtn.classList.remove("hidden");

        // Login succeeded — forward to the actual Google Sites private page
        // after a brief pause so the person sees confirmation first.
        statusEl.textContent = "Signed in. Redirecting…";
        setTimeout(() => {
          window.top.location.href = GOOGLE_SITES_PRIVATE_PAGE;
        }, 1000);
      } else {
        statusEl.textContent = "This account does not have access.";
        privateContent.style.display = "none";
        loginBtn.classList.add("hidden");
        logoutBtn.classList.remove("hidden");
      }
    } else {
      statusEl.textContent = "Not signed in.";
      privateContent.style.display = "none";
      loginBtn.classList.remove("hidden");
      logoutBtn.classList.add("hidden");
    }
  }

  loginBtn.addEventListener("click", () => {
    // Auth0's hosted login page refuses to render inside an iframe
    // (Google Sites embeds this page in an iframe), so instead of
    // letting the SDK redirect the iframe itself, we build the
    // authorize URL by hand and navigate the TOP-LEVEL tab to it —
    // not a new tab, the same browser tab, just breaking out of the frame.
    const authorizeUrl =
      "https://" + AUTH0_DOMAIN +
      "/authorize?client_id=" + AUTH0_CLIENT_ID +
      "&response_type=code" +
      "&redirect_uri=" + encodeURIComponent(REDIRECT_URI) +
      "&scope=" + encodeURIComponent("openid profile email");
    window.top.location.href = authorizeUrl;
  });

  logoutBtn.addEventListener("click", () => {
    // Same reasoning for logout: build the logout URL and navigate
    // the top-level tab instead of the iframe.
    const logoutUrl =
      "https://" + AUTH0_DOMAIN +
      "/v2/logout?client_id=" + AUTH0_CLIENT_ID +
      "&returnTo=" + encodeURIComponent(REDIRECT_URI);
    window.top.location.href = logoutUrl;
  });

  // If we're loaded inside an iframe AND we're not in the middle of
  // an Auth0 redirect callback, this detects that case on page load.
  initAuth0();
</script>

</body>
</html>
